name: freeze-birth-run-001

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/freeze-birth-run-001.yml'

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful Birth Run 001 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/birth001
          mkdir -p /tmp/birth001
          gh run download 35806542981 \
            --repo "${{ github.repository }}" \
            --name "birth-run-001-raw-709b9660c415beca6d188b279bfbe1672f0c85c3" \
            --dir /tmp/birth001

      - name: Verify raw artifact bytes
        run: |
          cd /tmp/birth001
          cat > SHA256SUMS.expected <<'EOF'
          012d0a5ec6a61cc52a8be5ea791e8cc4c65d9628b85fbec9472aa9443c7da032  CYCLE_SUMMARY.json
          ee9b6d0add4d5e72c734df9bd112bf1ae17f4e5ebb53e4e20fe4f72293a94a2f  DECISION_HISTORY.json
          e99dfe9191cfdd7fa3549dd9bf5f6ad14c1d67696af91f34fefee9cd9ee19fef  FINAL_SNAPSHOT.json
          2c027d26f0cf7da13902497b06738de72b03d7b4bb043e2f3f83d0cead10fa8b  HUMAN_TRANSCRIPT.md
          d766291cbd076e3c7d9185fc08c292df58791e2027fab2b92055fd5a2232aeb8  INITIAL_WORLD.json
          cad5c52ea6c02a805bf3599ca28defeea1c688a05fd92e3d8aeee908ae8fb748  README.md
          f06decacf9a63440afed7907f71208a8341f43ad528781c5d82c6cd9fb82b413  RUN_METADATA.json
          eb0ede12c7943daf992fe31c14b594fed4a589d329cbabd38b2daadb33c75a32  SEMANTIC_HISTORY.json
          EOF
          sha256sum --check SHA256SUMS.expected

          test "$(git hash-object INITIAL_WORLD.json)" = "25c5dec8ea9b329a8941f560c80ec4ce5c444180"
          cmp INITIAL_WORLD.json "$GITHUB_WORKSPACE/research/technical/SFL_V0_OBSERVATIONS/RUN-0001_BIRTH/INITIAL_WORLD.json"

      - name: Freeze raw package in Git
        run: |
          target="research/technical/SFL_V0_OBSERVATIONS/RUN-0001_BIRTH"
          cp /tmp/birth001/README.md "$target/README.md"
          cp /tmp/birth001/RUN_METADATA.json "$target/RUN_METADATA.json"
          cp /tmp/birth001/CYCLE_SUMMARY.json "$target/CYCLE_SUMMARY.json"
          cp /tmp/birth001/SEMANTIC_HISTORY.json "$target/SEMANTIC_HISTORY.json"
          cp /tmp/birth001/DECISION_HISTORY.json "$target/DECISION_HISTORY.json"
          cp /tmp/birth001/FINAL_SNAPSHOT.json "$target/FINAL_SNAPSHOT.json"
          cp /tmp/birth001/HUMAN_TRANSCRIPT.md "$target/HUMAN_TRANSCRIPT.md"

          git config user.name "Birth Run Archivist"
          git config user.email "actions@users.noreply.github.com"
          git add "$target"
          git diff --cached --exit-code && { echo "No raw package changes to commit"; exit 1; } || true
          git commit -m "observations: freeze raw Birth Run 001 package"
          git push origin HEAD:main
