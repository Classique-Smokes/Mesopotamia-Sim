name: canonical-verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore Mesopotamia.Sim.slnx

      - name: Static quality
        run: dotnet format Mesopotamia.Sim.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Mesopotamia.Sim.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Mesopotamia.Sim.slnx --configuration Release --no-build --no-restore

      - name: Slice-1 successor executed fault controls
        shell: pwsh
        run: |
          ./tests/Run-Slice1V2Mutants.ps1 -Dotnet (Get-Command dotnet).Source -Checkout "$env:RUNNER_TEMP/slice1-v2-mutants" -Evidence "$env:GITHUB_WORKSPACE/artifacts/acceptance/slice1-v2-mutants" -Revision HEAD

      - name: Acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfl-slice1-slice2-slice3-slice4-acceptance-evidence
          path: artifacts/acceptance/
          if-no-files-found: warn
