name: slice3-household-observation-0003

on:
  push:
    branches:
      - research/imp-0003-slice3-postimplementation-observation
    paths:
      - '.github/workflows/slice3-household-observation-0003.yml'
      - 'tools/Mesopotamia.Sim.Slice3ObservationRunner/**'

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: f7ca9525d17ed20758058df7aff97b2f47e5a01a
      OUTPUT_DIR: research/technical/SFL_V0_OBSERVATIONS/RUN-0003_HOUSEHOLD_PAUSE
    steps:
      - name: Checkout observation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert promoted production tree is unchanged
        shell: bash
        run: |
          git diff --name-only "$SOURCE_REVISION"..HEAD -- src/Mesopotamia.Sim tests/Mesopotamia.Sim.AcceptanceTests > /tmp/production-diff.txt
          if [ -s /tmp/production-diff.txt ]; then
            echo "Production/test diff from promoted Slice-3 revision:" >&2
            cat /tmp/production-diff.txt >&2
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: SDK information
        run: dotnet --info

      - name: Canonical restore
        run: dotnet restore Mesopotamia.Sim.slnx

      - name: Canonical static quality
        run: dotnet format Mesopotamia.Sim.slnx --verify-no-changes --no-restore

      - name: Canonical build
        run: dotnet build Mesopotamia.Sim.slnx --configuration Release --no-restore

      - name: Canonical tests
        run: dotnet test Mesopotamia.Sim.slnx --configuration Release --no-build --no-restore

      - name: Restore observation runner
        run: dotnet restore tools/Mesopotamia.Sim.Slice3ObservationRunner/Mesopotamia.Sim.Slice3ObservationRunner.csproj

      - name: Execute raw Slice-3 observation
        run: >
          dotnet run
          --project tools/Mesopotamia.Sim.Slice3ObservationRunner/Mesopotamia.Sim.Slice3ObservationRunner.csproj
          --configuration Release
          --no-restore
          --
          --output "$OUTPUT_DIR"

      - name: Record execution proof
        shell: bash
        run: |
          {
            echo "observation=IMP-0003-OBS-001"
            echo "source_revision=$SOURCE_REVISION"
            echo "harness_revision=$GITHUB_SHA"
            echo "production_test_diff_from_source=EMPTY"
            echo "canonical_restore=PASS"
            echo "canonical_format=PASS"
            echo "canonical_build=PASS"
            echo "canonical_test=PASS"
          } > "$OUTPUT_DIR/EXECUTION_PROOF.txt"

      - name: Upload raw observation package
        uses: actions/upload-artifact@v4
        with:
          name: sfl-slice3-household-observation-0003-raw-${{ github.sha }}
          path: research/technical/SFL_V0_OBSERVATIONS/RUN-0003_HOUSEHOLD_PAUSE/
          if-no-files-found: error
          retention-days: 30

      - name: Archive raw package on observation branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_DIR"
          git commit -m "research: archive raw Slice 3 observation"
          git push origin HEAD:research/imp-0003-slice3-postimplementation-observation
